<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genius Kiddo — Fase 2: Escolinha do Kiddo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7C5CFF; --blue:#4DA8FF; --yellow:#FFC93C; --green:#4FCB8D; --coral:#FF6B6B;
  --bg:#FFF8E7; --bg2:#FFEFC9; --ink:#2B2D42; --card:#FFFFFF; --muted:#5f6380; --line:rgba(43,45,66,.14);
  --shadow:0 6px 0 rgba(43,45,66,.13);
  --sky1:#bfe6ff; --sky2:#eaf8ff; --grass:#a9e883; --grass2:#7fd35f; --wood:#cf9150; --wood2:#a86b34;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a3a; --bg2:#14122b; --ink:#f4f1ff; --card:#2f2a5c; --muted:#c3bfe6; --line:rgba(255,255,255,.18);
    --shadow:0 6px 0 rgba(0,0,0,.35); --sky1:#2a3a82; --sky2:#1d1a3a; --grass:#2f7048; --grass2:#245a39;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a3a; --bg2:#14122b; --ink:#f4f1ff; --card:#2f2a5c; --muted:#c3bfe6; --line:rgba(255,255,255,.18);
  --shadow:0 6px 0 rgba(0,0,0,.35); --sky1:#2a3a82; --sky2:#1d1a3a; --grass:#2f7048; --grass2:#245a39;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',ui-rounded,'Nunito','Trebuchet MS',system-ui,sans-serif;font-size:18px;line-height:1.25;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.hidden{display:none!important}
.phone{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){body{background:var(--bg2)}.phone{box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.2)}}

/* barra e guia */
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.rb{width:56px;height:56px;flex:none;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:28px;display:grid;place-items:center;cursor:pointer}
.rb.big{width:64px;height:64px;font-size:32px}
.rb.small{width:44px;height:44px;font-size:20px;opacity:.7}
.rb:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,45,66,.13)}
.rb.off{opacity:.55}
.stars{margin-right:auto;display:flex;align-items:center;gap:4px;font-weight:800;font-size:24px;background:var(--card);border-radius:28px;padding:6px 14px;box-shadow:var(--shadow);min-height:48px}
.stars.bump{animation:pop .5s}
.langpill{display:flex;background:var(--card);border-radius:30px;padding:4px;box-shadow:var(--shadow)}
.langpill button{border:0;background:transparent;font-weight:800;font-size:18px;padding:6px 12px;border-radius:24px;min-height:48px;cursor:pointer}
.langpill button.on{background:var(--purple);color:#fff}
@media (max-width:380px){
  .rb{width:48px;height:48px;font-size:24px}.rb.big{width:54px;height:54px}.rb.small{width:40px;height:40px}
  .bar{gap:5px;padding:8px 8px 2px}.stars{font-size:20px;padding:4px 10px}
  .langpill button{padding:4px 8px;font-size:16px}
}
.guiderow{display:flex;align-items:center;gap:8px;padding:2px 12px 6px}
.guide{width:76px;height:84px;flex:none}
.guide svg,.bigguide svg{width:100%;height:100%;overflow:visible;animation:bob 3.2s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.bubble{flex:1;position:relative;background:var(--card);border-radius:22px;padding:8px 14px;font-weight:700;font-size:19px;box-shadow:var(--shadow);min-height:56px;display:flex;align-items:center}
.bubble::before{content:'';position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right-color:var(--card)}

main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px}

/* splash */
#sSplash{background:radial-gradient(circle at 50% 28%,#ffe08a 0,#ffb84a 40%,#ff8d5c 100%);color:#fff;cursor:pointer}
.bigguide{width:min(48vw,190px);height:min(53vw,210px)}
.title{font-size:clamp(36px,11vw,52px);font-weight:800;margin:0;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.sub{margin:0;font-size:20px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.play{width:104px;height:104px;border-radius:50%;border:0;background:#fff;color:var(--coral);font-size:48px;box-shadow:0 8px 0 rgba(0,0,0,.2);display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite;cursor:pointer}
.tap{font-weight:800;font-size:19px;margin:0}

/* escolha da série */
#sGrade{background:var(--bg);justify-content:flex-start;padding-top:14px;overflow-y:auto}
#sGrade h2{margin:0;font-size:28px}
#sGrade p{margin:0;color:var(--muted);font-weight:700;font-size:16px}
.gtop{display:flex;width:100%;justify-content:flex-end}
.gcards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.gcard{display:flex;align-items:center;gap:16px;border:0;border-radius:28px;padding:14px 18px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;text-align:left;min-height:92px}
.gcard:active{transform:translateY(4px)}
.gcard .gi{font-size:54px;line-height:1}
.gcard b{font-size:26px;display:block}
.gcard small{font-size:16px;color:var(--muted);font-weight:700}
.gcard.g0{box-shadow:0 6px 0 #ffb84a}.gcard.g1{box-shadow:0 6px 0 var(--blue)}.gcard.g2{box-shadow:0 6px 0 var(--purple)}

/* escola */
#sSchool{background:var(--bg)}
.campus{flex:1;overflow-y:auto;scrollbar-width:none}
.campus::-webkit-scrollbar{display:none}
.skystrip{position:relative;height:150px;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:42px}
.sun{position:absolute;right:18px;top:12px;font-size:44px}
.cloud{position:absolute;font-size:44px;opacity:.9;animation:drift 38s ease-in-out infinite alternate}
.cloud.c1{left:6%;top:14px}.cloud.c2{left:46%;top:46px;font-size:34px;animation-duration:52s}
.sign{position:relative;z-index:2;background:linear-gradient(var(--wood),var(--wood2));border:3px solid #7a4a22;border-radius:18px;padding:6px 20px 8px;color:#fff;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.sign b{display:block;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sign small{font-size:15px;font-weight:700;opacity:.95}
.sign::before,.sign::after{content:'';position:absolute;top:-16px;width:3px;height:16px;background:#7a4a22}
.sign::before{left:22%}.sign::after{right:22%}
.field{position:relative;margin-top:-30px;border-radius:32px 32px 0 0;background:linear-gradient(var(--grass),var(--grass2));padding:20px 0 18px;box-shadow:0 -5px 0 rgba(255,255,255,.35);min-height:360px}
.lots{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 8px}
.lot{position:relative;border:0;border-radius:28px;min-height:158px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.16)}
.lot:active{transform:translateY(4px)}
.lot.built{background:var(--card)}
.lot.empty{background:rgba(255,255,255,.4);box-shadow:none;outline:4px dashed rgba(255,255,255,.85);outline-offset:-6px}
.lot.locked{background:rgba(255,255,255,.18);box-shadow:none}
.lot.locked .scene{filter:grayscale(1) blur(1.5px);opacity:.45}
.lot.sug::after{content:'👆';position:absolute;right:-4px;bottom:34px;font-size:34px;animation:tapHand 1.1s ease-in-out infinite;z-index:3}
.lot.sug{animation:pulse 1.8s ease-in-out infinite}
.scene{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:2px 4px;line-height:1;width:100%}
.scene span{font-size:50px}
.scene.l2 span{font-size:42px}.scene.l3 span{font-size:36px}
.scene .plus{font-size:52px;opacity:.9}
.lname{font-weight:800;font-size:17px;text-align:center}
.lot.empty .lname,.lot.locked .lname{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lvl{font-size:15px;letter-spacing:1px}
.chip{background:var(--yellow);color:var(--ink);border-radius:20px;padding:0 12px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.chip.lockchip{background:#fff;font-size:22px}
.up{position:absolute;top:-8px;right:-6px;width:38px;height:38px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:pulse 1.4s ease-in-out infinite;z-index:3}
.lot.grow{animation:pop .7s}
.spark{position:absolute;font-size:26px;pointer-events:none;animation:spark 1s ease-out forwards;z-index:4}
.kids{display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;padding:6px 20px 0;font-size:30px;line-height:1.1}
.kids span.new{animation:pop .6s}
.dock{display:flex;gap:10px;padding:8px 14px 12px;background:var(--bg)}
.dbtn{position:relative;flex:1;height:68px;border:0;border-radius:34px;font-weight:800;font-size:20px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.dbtn:active{transform:translateY(4px)}
.dbtn.goals{background:var(--purple)}
.dbtn.promo{background:var(--green);animation:pulse 1.6s ease-in-out infinite}
.dbtn.done{background:#9a97b8;box-shadow:none}
.dbtn .bdg{position:absolute;top:-6px;right:10px;min-width:28px;height:28px;border-radius:14px;background:var(--coral);color:#fff;font-size:16px;display:grid;place-items:center;padding:0 6px;box-shadow:0 3px 0 rgba(0,0,0,.2)}

/* aulas */
#sLesson{padding:4px 14px 14px;gap:12px}
.dots{display:flex;justify-content:center;gap:10px;height:16px;flex:none}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--yellow)}.dots i.cur{background:var(--purple);transform:scale(1.25)}
.canvasbox{flex:1;min-height:0;display:grid;place-items:center;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:8px;overflow:hidden}
.art{width:100%;height:100%;max-height:100%}
.reg *{fill:#fff;stroke:#2B2D42;stroke-width:3;stroke-linejoin:round;transition:fill .25s;cursor:pointer}
.reg.hint *{animation:blinkfill 1s ease-in-out infinite}
.palette{display:flex;gap:6px;align-items:flex-start;flex:none}
.sw{flex:1;min-width:0;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:13px;cursor:pointer}
.sw i{display:block;width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 4px 0 rgba(0,0,0,.14)}
.sw.sel i{outline:5px solid var(--ink);outline-offset:2px;transform:scale(1.08)}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.card{aspect-ratio:1;border:0;border-radius:28px;background:var(--card);box-shadow:var(--shadow);font-size:clamp(56px,20vw,96px);display:grid;place-items:center;cursor:pointer;line-height:1;padding:10px}
.card svg{width:100%;height:100%}
.card:active{transform:translateY(4px)}
.card.ok{background:#c9f5de;animation:pop .55s}
.card.shake{animation:shake .45s}
.card.hintglow{outline:7px solid var(--yellow);outline-offset:2px}
.card.num{font-size:clamp(48px,16vw,72px);font-weight:800;color:var(--purple)}
.card.let{font-size:clamp(48px,16vw,72px);font-weight:800;color:var(--blue)}
.opts{display:flex;gap:12px;flex:none}
.opts .card{flex:1}
.plot{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px 14px;padding:14px;border-radius:28px;background:linear-gradient(#a56a3a,#7d4f29);box-shadow:var(--shadow)}
.pl{position:relative;border:0;background:rgba(255,255,255,.14);border-radius:22px;width:clamp(64px,19vw,84px);height:clamp(64px,19vw,84px);font-size:clamp(40px,12vw,54px);cursor:pointer;display:grid;place-items:center;line-height:1}
.pl i{position:absolute;right:-4px;bottom:-4px;min-width:30px;height:30px;border-radius:15px;background:var(--yellow);color:var(--ink);font-style:normal;font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.pl.grow{animation:pop .6s}
.shadowbox{flex:1;min-height:0;display:grid;place-items:center;background:var(--card);border-radius:28px;box-shadow:var(--shadow)}
.shadowbox .big{font-size:clamp(100px,38vw,170px);line-height:1}
.pads{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad{border:0;border-radius:32px;background:var(--c);color:rgba(255,255,255,.85);font-size:48px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),0 8px 0 rgba(0,0,0,.15);opacity:.82;cursor:pointer}
.pad.lit{opacity:1;transform:scale(1.05);filter:brightness(1.2);outline:8px solid rgba(255,255,255,.8)}
.wordcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);border-radius:28px;box-shadow:var(--shadow)}
.wordcard .em{font-size:clamp(96px,34vw,150px);line-height:1}
.wordcard .w{font-size:30px;font-weight:800;color:var(--purple)}
.baskets{display:flex;gap:12px;flex:none}
.basket{flex:1;min-height:118px;border:0;border-radius:26px;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 7px 0 rgba(0,0,0,.18);color:#fff;cursor:pointer}
.basket span{font-size:46px;line-height:1}
.basket.fruit{background:var(--coral)}.basket.veg{background:#2fae72}
.basket:active{transform:translateY(4px)}
.basket.hintglow{outline:7px solid var(--yellow);outline-offset:2px}
.basket.ok{animation:pop .5s}
.note{margin:0;text-align:center;font-size:15px;color:var(--muted);font-weight:700}

/* sobreposições */
.overlay{position:absolute;inset:0;background:rgba(29,26,58,.6);display:grid;place-items:center;z-index:30;padding:20px;overflow:hidden}
.cele{position:relative;z-index:2;background:var(--card);border-radius:36px;padding:26px 24px 24px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.2);max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.bigstar{font-size:96px;line-height:1;animation:pop .7s}
.plus{font-size:34px;font-weight:800;color:var(--purple)}
.ptxt{margin:0;font-size:21px;font-weight:700}
.cele .go{width:84px;height:84px;font-size:42px;background:var(--green);color:#fff}
.cf{position:absolute;top:-50px;font-size:30px;animation:fall linear forwards;z-index:1}
.sheetwrap{position:absolute;inset:0;z-index:25;display:flex;align-items:flex-end;background:rgba(29,26,58,.5)}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--card);border-radius:32px 32px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:slideUp .26s ease-out}
.sx{position:absolute;right:12px;top:12px;width:52px;height:52px;border-radius:50%;border:0;background:var(--bg);font-size:24px;cursor:pointer;box-shadow:var(--shadow)}
.shead{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.shead .sc{font-size:56px;line-height:1.05;letter-spacing:4px}
.shead b{font-size:26px}
.shead p{margin:0;color:var(--muted);font-weight:700;font-size:16px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;border:0;border-radius:36px;font-weight:800;font-size:22px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer;padding:0 20px}
.sbtn:active{transform:translateY(4px)}
.sbtn b{background:rgba(255,255,255,.28);border-radius:20px;padding:0 12px}
.sbtn.go{background:var(--green)}.sbtn.lesson{background:var(--purple)}.sbtn.dim{background:#9a97b8;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.sbtn.shake{animation:shake .45s}
.maxnote{text-align:center;font-weight:800;color:var(--green)}
.gpanel{padding-top:20px}
.gpanel h2{margin:0 60px 0 0;font-size:25px}
.medals{font-size:20px;font-weight:800}
.mis{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.mis .mi{font-size:38px;line-height:1}
.mis .mt{flex:1;min-width:0}
.mis .mt b{display:block;font-size:18px}
.bar2{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--yellow);border-radius:6px;transition:width .4s}
.mis.ok .bar2 i{background:var(--green)}
.mis .mb{border:0;border-radius:24px;min-height:54px;padding:0 14px;font-weight:800;font-size:18px;background:var(--green);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer;animation:pulse 1.5s ease-in-out infinite}
.mis .chk{font-size:34px;color:var(--green);font-weight:800}

/* portão e pais */
.lockbig{font-size:72px}
.hold{position:relative;overflow:hidden;border:0;border-radius:30px;background:var(--card);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 3px var(--purple);min-height:68px;padding:0 26px;font-weight:800;font-size:20px;cursor:pointer;touch-action:none;width:100%;max-width:340px}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(124,92,255,.35)}
.hold.holding .fill{width:100%;transition:width var(--ms,2000ms) linear}
.hold .lbl{position:relative}
.btn{border:0;border-radius:22px;padding:12px 20px;font-weight:800;font-size:18px;background:var(--purple);color:#fff;min-height:52px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.warn{background:var(--coral)}
.pp{flex:1;overflow-y:auto;padding:14px 16px 28px}
.pph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pph h2{margin:0;font-size:26px}
.sec{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec h3{margin:0 0 8px;font-size:19px}
.sec p,.sec li{font-size:16px;color:var(--muted);font-weight:600;margin:0 0 6px}
.sec ul{margin:0;padding-left:20px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:transparent;font-weight:800;font-size:16px;min-height:46px;cursor:pointer}
.seg button.on{background:var(--purple);border-color:var(--purple);color:#fff}
.stat{font-size:19px;font-weight:800;margin-bottom:8px}
select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:16px;padding:8px 12px}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}
@keyframes tapHand{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,-8px)}}
@keyframes blinkfill{50%{fill:#ffe39a}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(30px)}}

function shapeRound(g) {
  const SH = shuffle(g === 0 ? ['circle', 'square', 'triangle'] : ['circle', 'square', 'triangle', 'star', 'heart']);

  const t = { s: SH[0], c: CL[0] };

/* ---------- áudio ---------- */
let ac = null, master = null, musicGain = null, mTimer = null, mi = 0;
function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.gain.value = S.music ? 1 : 0; musicGain.connect(master);
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(freq, t, dur, type, vol, dest) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.05);
}
const PENT = [262, 294, 330, 392, 440, 523, 587, 659];
const MEL = [0, 2, 4, 2, 5, 4, 2, 0, 1, 3, 5, 3, 4, 2, 1, 0];
function musicTick() {
  if (!ac || !S.music || document.hidden) return;
  const t = ac.currentTime + 0.05, idx = MEL[mi % MEL.length];
  tone(PENT[idx], t, 0.55, 'triangle', 0.048, musicGain);
  tone(PENT[idx] * 2, t, 0.3, 'sine', 0.016, musicGain); /* brilho suave de oitava acima */
  if (mi % 4 === 0) {
    const root = PENT[idx] / 2;
    tone(root, t, 1.3, 'sine', 0.055, musicGain);
    tone(root * 1.5, t, 1.3, 'sine', 0.03, musicGain); /* quinta por baixo, dá corpo de acorde */
  }
  mi++;
}
function startMusic() { if (!mTimer) mTimer = setInterval(musicTick, 480); }
function setMusic(on) {
  S.music = on; save();
  if (musicGain) musicGain.gain.value = on ? 1 : 0;

}
const sfx = {

  good() { if (!ac) return; const t = ac.currentTime; [523, 659, 784].forEach((f, i) => tone(f, t + i * .09, .3, 'triangle', .11)); },
  win() { if (!ac) return; const t = ac.currentTime; [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * .11, .45, 'triangle', .12)); },
  oops() { if (!ac) return; const t = ac.currentTime; tone(247, t, .14, 'sine', .045); tone(196, t + .1, .2, 'sine', .04); },
  build() { if (!ac) return; const t = ac.currentTime; [0, .14, .28].forEach(d => tone(170, t + d, .09, 'square', .08)); [523, 659, 784, 1047].forEach((f, i) => tone(f, t + .5 + i * .1, .35, 'triangle', .12)); }
};

function voicePool(lang) {

function pickVoice(lang) {
  const pool = voicePool(lang); if (!pool.length) return null;

  if (chosen) { const v = pool.find(x => x.name === chosen); if (v) return v; }
  for (const n of VOICE_PREF[lang] || []) { const v = pool.find(x => x.name.includes(n)); if (v) return v; }

}
function speakRaw(text, lang, queue) {
  if (!hasTTS || !S.voice) return;
  try {
    if (!queue) speechSynthesis.cancel();
    const tn = TONES[S.tone] || TONES.fofa, v = pickVoice(lang);
    const chunks = text.replace(/[⭐👏🎉]/g, '').match(/[^!?.]+[!?.]*/g) || [text];
    chunks.forEach(c => {

      u.lang = lang; u.rate = tn[1];
      u.pitch = Math.min(2, tn[0] + (/!$/.test(c) ? 0.1 : 0) + (/\?$/.test(c) ? 0.05 : 0));

}

    const opts = shuffle([n, ...shuffle(pool).slice(0, g === 2 ? 3 : 2)]);
    $('#opts').innerHTML = opts.map(k => `<button class="card num" data-n="${k}">${k}</button>`).join('');
    say(L('Toque nas plantinhas e conte! Quantas são?', 'Tap the plants and count! How many are there?'));
  });
  R.start();
  $('#plot').onclick = e => {
    const b = e.target.closest('.pl'); if (!b || lock || b.dataset.c) return;
    counted++; b.dataset.c = counted; b.insertAdjacentHTML('beforeend', `<i>${counted}</i>`);
    sfx.pop(380 + counted * 50); speakName(nw(counted));
  };
  $('#opts').onclick = e => {
    const b = e.target.closest('.card'); if (!b || lock) return;
    if (+b.dataset.n === n) {
      lock = true; b.classList.add('ok');
      $$('.pl', A).forEach(p => { p.firstChild.textContent = '🌻'; p.classList.add('grow'); });
      sfx.good(); buzz(); speakName(nw(n)); say(praise(), true); R.next(1800);
    } else { b.classList.add('shake'); later(() => b.classList.remove('shake'), 480); wrongTap(nw(+b.dataset.n), L('Conte as plantinhas de novo!', 'Count the plants again!')); }
  };
};

/* ateliê: pintar */
LES.atelie = () => {
  const A = $('#sLesson'), art = ['flower', 'house', 'garden'][S.grade];
  A.innerHTML = `<div class="canvasbox">${ARTS[art]}</div><div class="palette" id="pal">${COLORS.map((c, k) => `<button class="sw${k === 0 ? ' sel' : ''}" data-c="${c.id}" style="--c:${c.hex}" aria-label="${L(c.pt, c.en)}"><i></i><span>${L(c.pt, c.en)}</span></button>`).join('')}</div>`;
  let color = COLORS[0], hintT = null;
  const painted = new Set(), regs = $$('.reg', A), total = regs.length;
  say(L('Escolha uma cor e toque no desenho!', 'Pick a color and tap the picture!'));
  const arm = () => {
    clearTimeout(hintT); regs.forEach(r => r.classList.remove('hint'));
    hintT = later(() => { const left = regs.filter(r => !painted.has(r.dataset.n)); if (left.length) rnd(left).classList.add('hint'); }, 7000);
  };
  arm();
  $('#pal').onclick = e => {
    const b = e.target.closest('.sw'); if (!b) return;
    color = COLORS.find(c => c.id === b.dataset.c);
    $$('.sw', A).forEach(x => x.classList.toggle('sel', x === b)); sfx.pop(600); speakName(L(color.pt, color.en)); arm();
  };
  $('svg', A).onclick = e => {
    const gr = e.target.closest('.reg'); if (!gr) return;
    $$('*', gr).forEach(c => c.style.fill = color.hex);
    painted.add(gr.dataset.n); sfx.pop(420 + painted.size * 60); buzz(); arm();
    if (painted.size === total) { clearTimeout(hintT); later(finishLesson, 450); }
  };
};

/* biblioteca: letras */
LES.biblio = () => {
  const A = $('#sLesson'), g = S.grade;
  A.innerHTML = `<div class="dots" id="dots"></div><div class="shadowbox"><span class="big" id="big"></span></div><div class="opts" id="opts"></div>`;
  let target = null, lock = false; const used = [];
  const R = rounds(3, () => {
    lock = false; target = rnd(LETIDS.filter(i => !used.includes(i))); used.push(target);
    $('#big').textContent = IT[target].e;
    $('#big').onclick = () => { sfx.pop(700); speakName(cap(nameOf(target))); };
    const nm = nameOf(target), l0 = initial(target);
    const pool = [...new Set(LETIDS.map(initial))].filter(x => x !== l0);
    const opts = shuffle([l0, ...shuffle(pool).slice(0, g === 1 ? 2 : 3)]);
    $('#opts').innerHTML = opts.map(x => `<button class="card let" data-l="${x}">${x}</button>`).join('');
    say(L(`${cap(nm)}! Com qual letra começa?`, `${cap(nm)}! Which letter does it start with?`));
  });
  R.start();
  $('#opts').onclick = e => {
    const b = e.target.closest('.card'); if (!b || lock) return; const l = b.dataset.l;
    if (l === initial(target)) { lock = true; b.classList.add('ok'); sfx.good(); buzz(); speakName(cap(nameOf(target))); say(L(`${praise()} Começa com ${l}!`, `${praise()} It starts with ${l}!`), true); R.next(2000); }
    else { b.classList.add('shake'); later(() => b.classList.remove('shake'), 480); wrongTap(l, L(`${cap(nameOf(target))}! Com qual letra começa?`, `${cap(nameOf(target))}! Which letter does it start with?`)); }
  };
};

/* pátio: repetir sequência de sons */
LES.patio = () => {
  const A = $('#sLesson'), lens = S.grade === 1 ? [2, 3] : [3, 4];
  const COL = ['#FF5A5F', '#4DA8FF', '#FFC93C', '#4FCB8D'], FR = [262, 330, 392, 523], SYM = ['●', '▲', '■', '★'];
  A.innerHTML = `<div class="dots" id="dots"></div><div class="pads" id="pads">${COL.map((c, i) => `<button class="pad" data-p="${i}" style="--c:${c}" aria-label="${L('Botão', 'Pad')} ${i + 1}">${SYM[i]}</button>`).join('')}</div><p class="note">${L('Olhe, escute e repita a sequência!', 'Watch, listen and repeat the sequence!')}</p>`;
  let seq = [], idx = 0, input = false;
  const flash = p => {
    const b = $(`.pad[data-p="${p}"]`, A); if (!b) return;
    b.classList.add('lit'); if (ac) tone(FR[p], ac.currentTime, .4, 'triangle', .14); later(() => b.classList.remove('lit'), 380);
  };
  const play = () => {
    input = false; say(L('Olhe e escute!', 'Watch and listen!'));
    seq.forEach((p, k) => later(() => flash(p), 1100 + k * 750));
    later(() => { input = true; idx = 0; say(L('Sua vez!', 'Your turn!')); }, 1100 + seq.length * 750 + 150);
  };
  const R = rounds(2, r => { seq = Array.from({ length: lens[r] }, () => Math.floor(Math.random() * 4)); play(); });
  R.start();
  $('#pads').onclick = e => {
    const b = e.target.closest('.pad'); if (!b || !input) return;
    const p = +b.dataset.p; flash(p); buzz();
    if (p === seq[idx]) {
      idx++;
      if (idx >= seq.length) { input = false; later(() => { sfx.good(); say(praise()); }, 450); R.next(2100); }
    } else {
      input = false; idx = 0;
      later(() => { sfx.oops(); say(L('Quase! Vamos ouvir de novo!', 'Almost! Let us listen again!')); }, 350);
      later(play, 2400);
    }
  };
};

/* refeitório: separar frutas e legumes */
LES.refeit = () => {
  const A = $('#sLesson');
  const FRU = ['apple', 'banana', 'grape', 'strawberry', 'orange', 'watermelon'], VEG = ['carrot', 'broccoli', 'potato', 'lettuce', 'onion'];
  const seq = shuffle([...shuffle(FRU).slice(0, 3).map(i => ({ i, k: 'fruit' })), ...shuffle(VEG).slice(0, 2).map(i => ({ i, k: 'veg' }))]);
  A.innerHTML = `<div class="dots" id="dots"></div><div class="wordcard"><div class="em" id="em"></div><div class="w" id="wd"></div></div>
    <div class="baskets" id="bk"><button class="basket fruit" data-k="fruit"><span>🧺</span><b>${L('Frutas', 'Fruits')}</b></button><button class="basket veg" data-k="veg"><span>🧺</span><b>${L('Legumes', 'Veggies')}</b></button></div>`;
  let lock = false, now = null;
  const R = rounds(5, r => {
    lock = false; now = seq[r]; $$('.basket', A).forEach(b => b.classList.remove('hintglow', 'ok'));
    $('#em').textContent = IT[now.i].e; $('#wd').textContent = nameOf(now.i);
    $('#em').onclick = () => { sfx.pop(700); speakName(cap(nameOf(now.i))); };
    say(L(`Onde vai ${artOf(now.i)} ${nameOf(now.i)}? Frutas ou legumes?`, `Where does ${artOf(now.i)} ${nameOf(now.i)} go? Fruits or veggies?`));
  });
  R.start();
  $('#bk').onclick = e => {
    const b = e.target.closest('.basket'); if (!b || lock) return;
    if (b.dataset.k === now.k) { lock = true; b.classList.add('ok'); sfx.good(); buzz(); speakName(cap(nameOf(now.i))); say(praise(), true); R.next(1500); }
    else { b.classList.add('shake'); later(() => b.classList.remove('shake'), 480); wrongTap(nameOf(now.i), L('Frutas ou legumes?', 'Fruits or veggies?')); const h = $(`.basket[data-k="${now.k}"]`, A); if (h) h.classList.add('hintglow'); }
  };
};

/* ---------- área dos pais ---------- */
function bindHold(btn, cb) {
  let t = null;
  const ms = parseInt(getComputedStyle(btn).getPropertyValue('--ms')) || 2000;
  const start = e => { e.preventDefault(); btn.classList.add('holding'); clearTimeout(t); t = setTimeout(() => { btn.classList.remove('holding'); cb(); }, ms); };
  const stop = () => { clearTimeout(t); btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
function renderGate() {
  const g = $('#sGate');
  g.innerHTML = `<div class="lockbig">🔒</div><h2 style="margin:0;font-size:28px">${L('Área dos pais', 'Parents area')}</h2>
    <p style="margin:0;color:var(--muted);font-weight:700">${L('Segure o botão por 2 segundos para entrar.', 'Hold the button for 2 seconds to enter.')}</p>
    <button class="hold" id="holdGate" style="--ms:2000ms"><span class="fill"></span><span class="lbl">${L('Segure aqui', 'Hold here')}</span></button>
    <button class="btn ghost" id="gateBack">${L('← Voltar', '← Back')}</button>`;
  bindHold($('#holdGate'), () => { sfx.good(); renderParents(); go('Parents'); });
  $('#gateBack').onclick = () => { go('School'); renderSchool(); };
}
function renderParents(keep) {
  const P = $('#sParents'), prev = keep && $('.pp', P) ? $('.pp', P).scrollTop : 0;
  const seg = (act, opts, now) => `<div class="seg">${opts.map(o => `<button data-act="${act}" data-v="${o[0]}" class="${String(now) === String(o[0]) ? 'on' : ''}">${o[1]}</button>`).join('')}</div>`;
  const g = S.grade == null ? 0 : S.grade;
  P.innerHTML = `<div class="pp">
    <div class="pph"><button class="rb" data-act="back" aria-label="${L('Voltar', 'Back')}">←</button><h2>${L('Área dos pais', 'Parents area')}</h2></div>

    <div class="sec"><h3>${L('Série da criança', 'Child’s grade')}</h3>
      ${seg('grade', GRADES.map((x, i) => [i, `${x.ico} ${L(x.pt, x.en)}`]), g)}
      <p style="margin-top:8px">${L('A série muda a dificuldade das aulas e os espaços disponíveis. O que já foi construído é mantido.', 'The grade changes lesson difficulty and available spaces. What was already built is kept.')}</p></div>

    <div class="sec"><h3>${L('Idioma', 'Language')}</h3>${seg('lang', [['pt', 'Português'], ['en', 'English']], S.lang)}
      <p style="margin-top:8px">${L('Voz, palavras e instruções mudam juntas. O progresso é compartilhado entre os idiomas.', 'Voice, words and instructions switch together. Progress is shared across languages.')}</p></div>

    <div class="sec"><h3>${L('Som', 'Sound')}</h3>
      ${seg('music', [['1', L('Música ligada', 'Music on')], ['0', L('Música desligada', 'Music off')]], S.music ? 1 : 0)}
      <div style="height:8px"></div>
      ${seg('voice', [['1', L('Voz do personagem ligada', 'Character voice on')], ['0', L('Só texto', 'Text only')]], S.voice ? 1 : 0)}</div>

    <div class="sec"><h3>${L('Tom da voz', 'Voice tone')}</h3>
      ${seg('tone', [['suave', L('Suave', 'Soft')], ['fofa', L('Fofa', 'Cute')], ['super', L('Super fofa', 'Extra cute')]], S.tone)}
      <div style="height:8px"></div>${voiceSelectHTML()}<div style="height:8px"></div>
      <button class="btn ghost" data-act="testVoice">${L('🔊 Testar a voz', '🔊 Test the voice')}</button></div>

    <div class="sec"><h3>${L('Progresso da escola', 'School progress')}</h3>
      <div class="stat">⭐ ${S.stars} · 🏫 ${builtCount()}/${SPACES.length} · 📘 ${S.lessons} · 🏅 ${S.medals}</div>
      <p>${L('Espaços construídos, aulas feitas e medalhas. Tudo fica só neste aparelho.', 'Built spaces, lessons done and medals. Everything stays on this device.')}</p></div>

    <div class="sec"><h3>${L('Para testar o protótipo', 'To test the prototype')}</h3>
      <div class="seg">
        <button data-act="plus10">⭐ +10</button>
        <button data-act="nextGrade">${L('Avançar de série', 'Advance grade')}</button>
        <button data-act="doGoals">${L('Cumprir objetivos', 'Complete goals')}</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn warn" data-act="reset">${L('Reiniciar escola', 'Reset school')}</button></div>

    <div class="sec"><h3>${L('Aparência', 'Appearance')}</h3>${seg('theme', [['auto', 'Auto'], ['light', L('Claro', 'Light')], ['dark', L('Escuro', 'Dark')]], S.theme)}</div>

    <div class="sec"><h3>${L('Privacidade e segurança', 'Privacy and safety')}</h3><ul>
      <li>${L('Sem login, sem anúncios e sem compras acessíveis à criança.', 'No login, no ads and no purchases a child can reach.')}</li>
      <li>${L('Nenhum dado pessoal é coletado ou enviado. A série é só uma configuração local, sem data de nascimento.', 'No personal data is collected or sent. The grade is only a local setting, with no birth date.')}</li>
      <li>${L('Sem relógio nem pressão: a escola cresce com as aulas feitas, não com o tempo. Sem sequência perdida, sem contagem regressiva.', 'No clock and no pressure: the school grows with lessons done, not with time. No lost streaks, no countdowns.')}</li>
      <li>${L('O microfone nunca é usado.', 'The microphone is never used.')}</li></ul></div>

    <div class="sec"><h3>${L('Sobre este protótipo', 'About this prototype')}</h3>
      <p>${L('Fase 2 do Genius Kiddo: a criança constrói e melhora a escolinha com as estrelas das aulas, cumpre os objetivos do ano e passa de série. As vozes vêm do aparelho e a música é gerada na hora. Pausa para descansar e voz gravada ficam para a versão final.', 'Genius Kiddo phase 2: the child builds and upgrades the school with lesson stars, reaches the year’s goals and moves up a grade. Voices come from the device and music is generated on the fly. Rest break and recorded voice come in the final version.')}</p></div>
  </div>`;
  const pp = $('.pp', P); if (prev) pp.scrollTop = prev;
}
$('#sParents').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'back') { go('School'); renderSchool(); say(schoolHint()); return; }
  if (a === 'grade') { S.grade = +v; S.claimed = [false, false, false]; S.lessonsYear = 0; S.fresh = []; save(); }
  if (a === 'lang') { S.lang = v; save(); updateLangUI(); }
  if (a === 'music') setMusic(v === '1');
  if (a === 'voice') { S.voice = v === '1'; save(); }
  if (a === 'tone') { S.tone = v; save(); testVoice(); }
  if (a === 'testVoice') { testVoice(); return; }
  if (a === 'theme') { S.theme = v; save(); applyTheme(); }
  if (a === 'plus10') { S.stars += 10; save(); updateStars(true); }
  if (a === 'nextGrade') {
    if (S.grade < 2) { S.grade++; S.claimed = [false, false, false]; S.lessonsYear = 0; S.fresh = SPACES.filter(s => s.grade === S.grade).map(s => s.id); save(); }
  }
  if (a === 'doGoals') {
    const ms = mList();
    SPACES.filter(s => S.grade >= s.grade).forEach(s => { if (lvlOf(s.id) < 1) S.built[s.id] = 1; });
    if (ms[2].n >= 1) { const need = ms[2].n, lv = ms[2].ico === '⬆️' ? 2 : 3; SPACES.filter(s => S.grade >= s.grade).slice(0, need).forEach(s => { if (lvlOf(s.id) < lv) S.built[s.id] = lv; }); }
    S.lessonsYear = Math.max(S.lessonsYear, ms[1].n); save();
  }
  if (a === 'reset') {
    if (b.dataset.sure) { S = Object.assign(S, { grade: null, stars: 3, built: { sala: 1 }, lessons: 0, lessonsYear: 0, claimed: [false, false, false], medals: 0, done: false, fresh: [] }); save(); updateStars(); go('Grade'); renderGrade(); return; }
    b.dataset.sure = '1'; b.textContent = L('Toque de novo para confirmar', 'Tap again to confirm');
    setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = L('Reiniciar escola', 'Reset school'); } }, 3000); return;
  }
  renderParents(true);
});
$('#sParents').addEventListener('change', e => {
  if (e.target.id === 'voiceSel') { S.voices[S.lang === 'en' ? 'en' : 'pt'] = e.target.value; save(); testVoice(); }
});

/* ---------- eventos globais ---------- */
$('#sSplash').addEventListener('click', () => {
  ensureAudio(); startMusic();
  if (S.grade == null) {
    go('Grade'); renderGrade();
    speakRaw('Oi! Peça ajuda a um adulto para escolher a série!', 'pt-BR');
  } else {
    go('School'); renderSchool();
    say(L('Oi! Que bom te ver! Vamos cuidar da nossa escola?', 'Hi! So good to see you! Shall we take care of our school?'));
  }
});
$$('#bar .langpill button').forEach(b => b.addEventListener('click', () => { sfx.pop(); setLang(b.dataset.l); }));
$('#btnHome').onclick = () => { sfx.pop(); go('School'); renderSchool(); say(schoolHint()); };
$('#btnMusic').onclick = () => { ensureAudio(); setMusic(!S.music); };
$('#btnRepeat').onclick = () => { if (lastText) say(lastText); };
$('#btnLock').onclick = () => { closeSheet(); renderGate(); go('Gate'); };
document.addEventListener('pointerdown', () => { if (ac && ac.state === 'suspended') ac.resume(); }, { passive: true });

/* ---------- início ---------- */
applyTheme(); updateStars(); updateLangUI(); setMusic(S.music);
})();
</script>
